name: APK bauen

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GXTUBE_VERSION_CODE: ${{ github.run_number }}
      GXTUBE_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: APK bauen (Release, signiert)
        run: ./gradlew --stacktrace assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk "GXTube-${GXTUBE_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GXTube-${{ env.GXTUBE_VERSION_NAME }}
          path: GXTube-*.apk

      - name: YouTube-Verbindungstest (nur Info)
        continue-on-error: true
        env:
          GXTUBE_ONLINE_TESTS: '1'
        run: ./gradlew testDebugUnitTest --tests 'de.abilas.gxtube.OnlineSmokeTest' --rerun

      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.GXTUBE_VERSION_NAME }}
          name: GX Tube ${{ env.GXTUBE_VERSION_NAME }}
          make_latest: true
          files: GXTube-*.apk
          body: |
            **Installieren:** `GXTube-${{ env.GXTUBE_VERSION_NAME }}.apk` unten auf dem Handy herunterladen und öffnen.
            Beim ersten Mal fragt Android, ob der Browser Apps installieren darf → erlauben.

            Updates lassen sich einfach drüber installieren – Abos und Verlauf bleiben erhalten.

            Stand: ${{ github.sha }}

  screenshots:
    # Startet die APK im Android-Emulator und legt Screenshots im Branch "screenshots" ab
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: GXTube-0.1.${{ github.run_number }}
          path: apk

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator + Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/screenshots.sh "$(ls apk/*.apk | head -1)" shots

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: shots

      - name: Screenshots im Branch "screenshots" ablegen
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots von ${GITHUB_SHA::7} (Lauf ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots
