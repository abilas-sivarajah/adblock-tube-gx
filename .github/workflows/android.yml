name: APK bauen

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GXTUBE_VERSION_CODE: ${{ github.run_number }}
      GXTUBE_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: APK bauen (Release, signiert)
        run: ./gradlew --stacktrace assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk "GXTube-${GXTUBE_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GXTube-${{ env.GXTUBE_VERSION_NAME }}
          path: GXTube-*.apk

      - name: YouTube-Verbindungstest (nur Info)
        continue-on-error: true
        env:
          GXTUBE_ONLINE_TESTS: '1'
        run: ./gradlew testDebugUnitTest --tests 'de.abilas.gxtube.OnlineSmokeTest' --rerun

      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.GXTUBE_VERSION_NAME }}
          name: GX Tube ${{ env.GXTUBE_VERSION_NAME }}
          make_latest: true
          files: GXTube-*.apk
          body: |
            **Installieren:** `GXTube-${{ env.GXTUBE_VERSION_NAME }}.apk` unten auf dem Handy herunterladen und öffnen.
            Beim ersten Mal fragt Android, ob der Browser Apps installieren darf → erlauben.

            Updates lassen sich einfach drüber installieren – Abos und Verlauf bleiben erhalten.

            Stand: ${{ github.sha }}
